# Timeweb Cloud Deployment Configuration
# TanStack Start (Nitro node-server) + Supabase proxy on api.* subdomain

resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
resolver_timeout 10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

map $http_origin $cors_origin {
    default "";
    "~*^https?://(localhost(:[0-9]+)?|([a-z0-9-]+\.)?unvrsm\.ru|([a-z0-9-]+\.)?psygrafik\.ru|.*\.lovable\.(app|dev))$" $http_origin;
}

# 1. Supabase proxy (api.psygrafik.ru / api.unvrsm.ru)
server {
    listen 8080;
    server_name api.psygrafik.ru api.unvrsm.ru;

    set $supabase_upstream "poapzmmpbwdcoldvofen.supabase.co";

    location / {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "$cors_origin" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, range, prefer, accept-profile, content-profile, x-requested-with" always;
            add_header Access-Control-Max-Age 86400 always;
            return 204;
        }

        proxy_pass https://$supabase_upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_upstream;
        proxy_set_header Host $supabase_upstream;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        add_header Access-Control-Allow-Origin "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Expose-Headers "content-range, x-supabase-api-version" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        client_max_body_size 50m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# 2. Main application (default server — any other host: psygrafik.ru, app.unvrsm.ru ...)
server {
    listen 8080 default_server;
    server_name _;

    location /__health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /assets/ {
        root /app/dist/public;
        expires max;
        add_header Cache-Control "public, immutable";
        try_files $uri @app;
    }

    location / {
        try_files /nonexistent @app;
    }

    location @app {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
