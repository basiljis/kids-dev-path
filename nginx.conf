# Timeweb Cloud Deployment Configuration

# Base Nginx for SPA and Supabase Proxy
resolver 8.8.8.8 1.1.1.1 ipv6=off valid=300s;
resolver_timeout 10s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name app.unvrsm.ru;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 8080;
    server_name api.unvrsm.ru;

    set $supabase_upstream "poapzmmpbwdcoldvofen.supabase.co";

    location / {
        proxy_pass https://$supabase_upstream$request_uri;
        proxy_ssl_server_name on;
        proxy_ssl_name $supabase_upstream;
        proxy_set_header Host $supabase_upstream;
        
        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;

        if ($http_origin ~* ^https?://(localhost(:[0-9]+)?|(www\.)?unvrsm\.ru|app\.unvrsm\.ru|.*\.lovable\.(app|dev))$) {
            set $cors_origin $http_origin;
        }

        add_header Access-Control-Allow-Origin "$cors_origin" always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-supabase-api-version, range, prefer, accept-profile, content-profile, x-requested-with" always;
        
        if ($request_method = OPTIONS) {
            return 204;
        }

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Timeout & Buffering
        client_max_body_size 50m;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        
        add_header Cache-Control "no-store" always;
    }
}
